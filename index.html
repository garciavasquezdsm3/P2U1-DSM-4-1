<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 GVO</title>
    <!-- Play CDN: descarga Tailwind y genera las clases que uses, sin build step -->
  <script src="https://cdn.tailwindcss.com"></script>
<!-- cierre de head -->
</head>
</head> 
<body> 
    <!-- div contenedor: flex flex-col apila las cajas en columna en celular -->
<!-- md:flex-row: desde 768px cambia a fila · gap-4: separación entre cajas -->
<div class="flex flex-col md:flex-row gap-4">
  <!-- primera caja: fondo verde claro y relleno interno -->
  <div class="bg-emerald-200 p-4">Caja 1</div>
  <!-- segunda caja: mismo patrón, un tono de verde más oscuro -->
  <div class="bg-emerald-300 p-4">Caja 2</div>
<!-- cierre del div contenedor -->
</div>
</body>
</html>
